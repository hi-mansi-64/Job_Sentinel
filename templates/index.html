<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JobSentinel | Scam Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center min-vh-100 bg-gradient">

  <div class="card app-card text-center p-4 p-md-5">

    <h1 class="brand mb-2">JobSentinel</h1>
    <p class="subtitle mb-4">Smart Job Authenticity & Scam Detection Platform</p>

    <form method="POST" action="/check">
      <div class="mb-3">
        <textarea 
          class="form-control custom-textarea" 
          name="job_text" 
          rows="6" 
          placeholder="Paste the complete job description here..." 
          required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100 custom-btn">Analyze Job</button>
    </form>

    <p class="footer-text mt-4">⚠ No personal data is stored • Educational project</p>

  </div>

</div>

</body>
</html>
